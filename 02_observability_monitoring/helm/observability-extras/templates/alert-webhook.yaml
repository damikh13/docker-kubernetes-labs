# Alertmanager receiver: an echo server that prints every notification to stdout.
#   kubectl -n monitoring logs deploy/alert-webhook
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  labels: { app: alert-webhook }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alert-webhook }
  template:
    metadata:
      labels: { app: alert-webhook }
    spec:
      containers:
        - name: echo
          image: {{ .Values.webhook.image }}
          env:
            - name: HTTP_PORT
              value: "8080"
          ports:
            - { name: http, containerPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  labels: { app: alert-webhook }
spec:
  selector: { app: alert-webhook }
  ports:
    - { name: http, port: 8080, targetPort: http }
