# Tells Prometheus (prometheus-operator) to scrape /metrics of this Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab-api
  labels:
    app.kubernetes.io/name: lab-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
